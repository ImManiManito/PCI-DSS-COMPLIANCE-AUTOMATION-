---
# Cada herramienta corre de forma independiente: si una falla, las demás siguen y
# envían su evidencia; al final el playbook termina con error indicando cuál falló.
- name: Compromised Passwords - Daily Security Activities
  hosts: localhost
  gather_facts: false

  tasks:

    - name: Execute FortiGate - Admin Login Failed
      block:
        - name: FortiGate - Admin Login Failed
          ansible.builtin.include_tasks: ../../roles/fortigate/admin_login_failed/tasks/main.yml
      rescue:
        - name: Registrar falla de FortiGate - Admin Login Failed (las demás herramientas continúan)
          ansible.builtin.set_fact:
            pci_failed_sections: "{{ pci_failed_sections | default([]) + ['FortiGate - Admin Login Failed'] }}"

    - name: Execute Checkpoint - Authentication Failures
      block:
        - name: Checkpoint - Authentication Failures
          ansible.builtin.include_tasks: "../../roles/checkpoint/authentication failures/tasks/main.yml"
      rescue:
        - name: Registrar falla de Checkpoint - Authentication Failures
          ansible.builtin.set_fact:
            pci_failed_sections: "{{ pci_failed_sections | default([]) + ['Checkpoint - Authentication Failures'] }}"

    - name: Verificar que todas las herramientas enviaron su evidencia
      ansible.builtin.fail:
        msg: "No se envió la evidencia de: {{ pci_failed_sections | join(', ') }}. Revise los errores anteriores."
      when: pci_failed_sections | default([]) | length > 0
