---
- name: Wazuh CHD SAD Review 7 días - Cargar credenciales (vault)
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../vars/vault.yml"

- name: Wazuh CHD SAD Review 7 días - Definir rango de fechas (últimos 7 días)
  ansible.builtin.set_fact:
    wazuh_chd_sad_7d_end_date: "{{ now(fmt='%Y-%m-%d') }}"
    wazuh_chd_sad_7d_start_date: "{{ lookup('pipe', 'date -d \"-6 days\" +%Y-%m-%d') }}"
    wazuh_chd_sad_7d_evidence_dir: "{{ wazuh_chd_sad_7d_evidence_dir | default('/opt/pci-dss-evidence/wazuh/chd_sad_review_7_days') }}"
    wazuh_alerts_base_dir: "{{ wazuh_alerts_base_dir | default('/var/ossec/logs/alerts') }}"

- name: Wazuh CHD SAD Review 7 días - Crear directorio de evidencias
  ansible.builtin.file:
    path: "{{ wazuh_chd_sad_7d_evidence_dir }}"
    state: directory
    mode: "0750"

- name: Wazuh CHD SAD Review 7 días - Definir requisitos PCI DSS a filtrar
  ansible.builtin.set_fact:
    wazuh_chd_sad_7d_requirements:
      - { req: "10.6.1", name: "Eventos de impacto de seguridad CHD SAD" }
      - { req: "10.2.4", name: "Fallos de autenticación" }
      - { req: "10.2.7", name: "Modificaciones de objetos" }
    wazuh_chd_sad_7d_suffix: "7_dias_{{ wazuh_chd_sad_7d_start_date }}_a_{{ wazuh_chd_sad_7d_end_date }}"

- name: Wazuh CHD SAD Review 7 días - Filtrar histórico de alertas (PCI DSS 10.6.1, 10.2.4, 10.2.7) y generar evidencia CSV
  ansible.builtin.shell:
    cmd: >
      bash "{{ playbook_dir }}/../../roles/wazuh/chd_sad_review_7_days/scripts/chd_sad_review_7_days.sh"
      "{{ wazuh_alerts_base_dir }}"
      "{{ item.req }}"
      "7"
      | python3 "{{ playbook_dir }}/../../roles/wazuh/chd_sad_review/scripts/parse_chd_sad_review.py"
      > "{{ wazuh_chd_sad_7d_evidence_dir }}/{{ item.name }}_{{ wazuh_chd_sad_7d_suffix }}.csv"
  become: true
  become_method: sudo
  vars:
    ansible_become_password: "{{ wazuh_become_password }}"
    ansible_pipelining: false
  loop: "{{ wazuh_chd_sad_7d_requirements }}"
  loop_control:
    label: "{{ item.req }} - {{ item.name }}"
  register: wazuh_chd_sad_review_7d_result
  changed_when: false
  timeout: 300

- name: Wazuh CHD SAD Review 7 días - Enviar evidencia por correo
  ansible.builtin.command:
    argv:
      - bash
      - "{{ playbook_dir }}/../../roles/wazuh/common/send_mail_report.sh"
      - "{{ wazuh_mail_from }}"
      - "{{ wazuh_mail_to }}"
      - "Wazuh CHD SAD Review 7 días - Evidencia PCI DSS 10.6.1, 10.2.4, 10.2.7 ({{ wazuh_chd_sad_7d_start_date }} a {{ wazuh_chd_sad_7d_end_date }})"
      - "{{ wazuh_chd_sad_7d_evidence_dir }}/Eventos de impacto de seguridad CHD SAD_{{ wazuh_chd_sad_7d_suffix }}.csv"
      - "{{ wazuh_chd_sad_7d_evidence_dir }}/Fallos de autenticación_{{ wazuh_chd_sad_7d_suffix }}.csv"
      - "{{ wazuh_chd_sad_7d_evidence_dir }}/Modificaciones de objetos_{{ wazuh_chd_sad_7d_suffix }}.csv"
  changed_when: false