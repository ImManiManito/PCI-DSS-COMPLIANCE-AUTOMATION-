---
- name: FortiGate System Events - Cargar variables de correo (vault)
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../vars/vault.yml"

- name: FortiGate System Events - Definir fecha del reporte (últimas 24 horas)
  ansible.builtin.set_fact:
    fortigate_system_events_report_date: "{{ lookup('pipe', 'TZ=America/Mexico_City date +%Y-%m-%d') }}"
    fortigate_run_id: "{{ lookup('ansible.builtin.env', 'PCI_RUN_ID') }}"

- name: FortiGate System Events - Definir subtipos de eventos a recolectar
  ansible.builtin.set_fact:
    fortigate_system_events_types:
      - subtype: system
        label: "General System Events"
        filename: "Eventos_generales_de_seguridad.txt"
      - subtype: vpn
        label: "VPN Events"
        filename: "Fallos_de_autenticacionVPN.txt"
      - subtype: user
        label: "User Events"
        filename: "Eventos_de_usuariosVPN.txt"

# Nada se guarda en el servidor: logs y evidencia solo existen en un directorio
# temporal privado (0700) que se elimina al terminar, se envíe o no el correo.
- name: FortiGate System Events - Crear directorio temporal de trabajo
  ansible.builtin.tempfile:
    state: directory
    prefix: pci_fortigate_system_events_
  register: fortigate_system_events_tmp
  delegate_to: localhost

- name: FortiGate System Events - Recolectar, generar, enviar y eliminar evidencia
  block:
    # Logs crudos: una sola sesión SSH por FortiGate y por corrida (common/fortigate_collect_logs.sh).
    # En cron se comparten entre playbooks en PCI_RUN_TMPDIR (lo borra scripts_cron/run_*.sh);
    # en una ejecución manual quedan dentro del directorio temporal de este rol.
    - name: FortiGate System Events - Definir rutas temporales
      ansible.builtin.set_fact:
        fortigate_system_events_evidence_dir: "{{ fortigate_system_events_tmp.path }}"
        fortigate_log_cache_dir: "{{ lookup('ansible.builtin.env', 'PCI_RUN_TMPDIR') | default(fortigate_system_events_tmp.path ~ '/cache', true) }}"

    - name: FortiGate System Events - Ejecutar recolección de logs vía CLI (svc_ansible)
      ansible.builtin.command:
        argv:
          - bash
          - "{{ playbook_dir }}/../../roles/fortigate/system_events/scripts/fortigate_system_events.sh"
          - "{{ hostvars[item.0].ansible_host }}"
          - "{{ hostvars[item.0].ansible_port }}"
          - "{{ hostvars[item.0].ansible_user }}"
          - "{{ hostvars[item.0].ansible_ssh_private_key_file }}"
          - "{{ item.0 }}"
          - "{{ fortigate_run_id }}"
          - "{{ fortigate_log_cache_dir }}"
          - "{{ item.1.subtype }}"
      loop: "{{ groups['fortigates'] | product(fortigate_system_events_types) | list }}"
      loop_control:
        label: "{{ item.0 }} - {{ item.1.label }}"
      register: fortigate_system_events_results
      changed_when: false
      delegate_to: localhost

    - name: FortiGate System Events - Generar evidencia en archivos .txt
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../roles/fortigate/system_events/templates/system_events_report.txt.j2"
        dest: "{{ fortigate_system_events_evidence_dir }}/{{ item.1.filename }}"
        mode: "0600"
      loop: "{{ groups['fortigates'] | product(fortigate_system_events_types) | list }}"
      loop_control:
        label: "{{ item.0 }} - {{ item.1.label }}"
        index_var: fortigate_system_events_idx
      vars:
        fortigate_device: "{{ item.0 }}"
        fortigate_event_subtype: "{{ item.1.subtype }}"
        fortigate_event_label: "{{ item.1.label }}"
        fortigate_raw_output: "{{ fortigate_system_events_results.results[fortigate_system_events_idx].stdout }}"
      delegate_to: localhost

    - name: FortiGate System Events - Enviar evidencia por correo
      ansible.builtin.command:
        argv:
          - bash
          - "{{ playbook_dir }}/../../roles/fortigate/common/send_mail_report.sh"
          - "{{ fortigate_mail_from }}"
          - "{{ fortigate_mail_to }}"
          - "FortiGate System Events - Evidencia PCI DSS ({{ fortigate_system_events_report_date }})"
          - "{{ fortigate_system_events_evidence_dir }}/Eventos_generales_de_seguridad.txt"
          - "{{ fortigate_system_events_evidence_dir }}/Fallos_de_autenticacionVPN.txt"
          - "{{ fortigate_system_events_evidence_dir }}/Eventos_de_usuariosVPN.txt"
      changed_when: false
      delegate_to: localhost
  always:
    - name: FortiGate System Events - Eliminar evidencia y logs del servidor
      ansible.builtin.file:
        path: "{{ fortigate_system_events_tmp.path }}"
        state: absent
      delegate_to: localhost
