---
- name: FortiGate System Events - Definir fecha del reporte (últimas 24 horas)
  ansible.builtin.set_fact:
    fortigate_system_events_report_date: "{{ now(fmt='%Y-%m-%d') }}"
    fortigate_system_events_evidence_dir: "{{ fortigate_system_events_evidence_dir | default('/opt/pci-dss-evidence/fortigate/system_events') }}"

- name: FortiGate System Events - Definir subtipos de eventos a recolectar
  ansible.builtin.set_fact:
    fortigate_system_events_types:
      - subtype: system
        label: "General System Events"
        filename: "Eventos_generales_de_seguridad.txt"
      - subtype: vpn
        label: "VPN Events"
        filename: "Fallos_de_autenticacionVPN.txt"
      - subtype: user
        label: "User Events"
        filename: "Eventos_de_usuariosVPN.txt"

- name: FortiGate System Events - Crear directorio de evidencias
  ansible.builtin.file:
    path: "{{ fortigate_system_events_evidence_dir }}"
    state: directory
    mode: "0750"
  delegate_to: localhost

- name: FortiGate System Events - Ejecutar recolección de logs vía CLI (svc_ansible)
  ansible.builtin.command:
    cmd:
      - bash
      - "{{ playbook_dir }}/../../roles/fortigate/system_events/scripts/fortigate_system_events.sh"
      - "{{ hostvars[item.0].ansible_host }}"
      - "{{ hostvars[item.0].ansible_port }}"
      - "{{ hostvars[item.0].ansible_user }}"
      - "{{ hostvars[item.0].ansible_ssh_private_key_file }}"
      - "{{ item.1.subtype }}"
      - "{{ fortigate_system_events_report_date }}"
  loop: "{{ groups['fortigates'] | product(fortigate_system_events_types) | list }}"
  loop_control:
    label: "{{ item.0 }} - {{ item.1.label }}"
    index_var: fortigate_system_events_idx
  register: fortigate_system_events_results
  changed_when: false
  delegate_to: localhost

- name: FortiGate System Events - Generar evidencia en archivos .txt
  ansible.builtin.template:
    src: system_events_report.txt.j2
    dest: "{{ fortigate_system_events_evidence_dir }}/{{ item.1.filename }}"
    mode: "0640"
  loop: "{{ groups['fortigates'] | product(fortigate_system_events_types) | list }}"
  loop_control:
    label: "{{ item.0 }} - {{ item.1.label }}"
    index_var: fortigate_system_events_idx
  vars:
    fortigate_device: "{{ item.0 }}"
    fortigate_event_subtype: "{{ item.1.subtype }}"
    fortigate_event_label: "{{ item.1.label }}"
    fortigate_raw_output: "{{ fortigate_system_events_results.results[fortigate_system_events_idx].stdout }}"
  delegate_to: localhost
