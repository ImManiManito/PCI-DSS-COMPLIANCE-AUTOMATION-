---
# Variables del correo utilizadas para enviar la evidencia PCI DSS.
# IMPORTANTE: este archivo debe cifrarse con Ansible Vault antes de usarse en producción:
# ansible-vault encrypt roles/fortigate/vars/vault.yml
fortigate_mail_from: "correo@dominio.com"
fortigate_mail_to: "correo@dominio.com"

# Correo de cada usuario VPN (usuario FortiGate: correo). Quien no esté aquí NO se cambia.
# Tras editar, cifrar el archivo con ansible-vault.
fortigate_vpn_user_emails:
  usuario.ejemplo: "usuario.ejemplo@dominio.com"
