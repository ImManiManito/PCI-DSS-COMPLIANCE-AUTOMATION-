---
- name: FortiGate Configuration Changes - Cargar variables de correo (vault)
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../vars/vault.yml"

- name: FortiGate Configuration Changes - Definir fecha del reporte (últimas 24 horas)
  ansible.builtin.set_fact:
    fortigate_configuration_changes_report_date: "{{ now(fmt='%Y-%m-%d') }}"
    fortigate_configuration_changes_file: "alertamiento-detección.txt"
    fortigate_run_id: "{{ lookup('ansible.builtin.env', 'PCI_RUN_ID') }}"

# Nada se guarda en el servidor: logs y evidencia solo existen en un directorio
# temporal privado (0700) que se elimina al terminar, se envíe o no el correo.
- name: FortiGate Configuration Changes - Crear directorio temporal de trabajo
  ansible.builtin.tempfile:
    state: directory
    prefix: pci_fortigate_configuration_changes_
  register: fortigate_configuration_changes_tmp
  delegate_to: localhost

- name: FortiGate Configuration Changes - Recolectar, generar, enviar y eliminar evidencia
  block:
    # Logs crudos: una sola sesión SSH por FortiGate y por corrida (common/fortigate_collect_logs.sh).
    # En cron se comparten entre playbooks en PCI_RUN_TMPDIR (lo borra scripts_cron/run_*.sh);
    # en una ejecución manual quedan dentro del directorio temporal de este rol.
    - name: FortiGate Configuration Changes - Definir rutas temporales
      ansible.builtin.set_fact:
        fortigate_configuration_changes_evidence_dir: "{{ fortigate_configuration_changes_tmp.path }}"
        fortigate_log_cache_dir: "{{ lookup('ansible.builtin.env', 'PCI_RUN_TMPDIR') | default(fortigate_configuration_changes_tmp.path ~ '/cache', true) }}"

    - name: FortiGate Configuration Changes - Ejecutar recolección de logs vía CLI (svc_ansible)
      ansible.builtin.command:
        argv:
          - bash
          - "{{ playbook_dir }}/../../roles/fortigate/configuration_changes/scripts/fortigate_configuration_changes.sh"
          - "{{ hostvars[item].ansible_host }}"
          - "{{ hostvars[item].ansible_port }}"
          - "{{ hostvars[item].ansible_user }}"
          - "{{ hostvars[item].ansible_ssh_private_key_file }}"
          - "{{ item }}"
          - "{{ fortigate_run_id }}"
          - "{{ fortigate_log_cache_dir }}"
          - "{{ fortigate_configuration_changes_report_date }}"
      loop: "{{ groups['fortigates'] }}"
      loop_control:
        label: "{{ item }}"
      register: fortigate_configuration_changes_results
      changed_when: false
      delegate_to: localhost

    - name: FortiGate Configuration Changes - Generar evidencia en archivo .txt (una sección por equipo)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../roles/fortigate/configuration_changes/templates/configuration_changes_report.txt.j2"
        dest: "{{ fortigate_configuration_changes_evidence_dir }}/{{ fortigate_configuration_changes_file }}"
        mode: "0600"
      delegate_to: localhost

    - name: FortiGate Configuration Changes - Enviar evidencia por correo
      ansible.builtin.command:
        argv:
          - bash
          - "{{ playbook_dir }}/../../roles/fortigate/common/send_mail_report.sh"
          - "{{ fortigate_mail_from }}"
          - "{{ fortigate_mail_to }}"
          - "FortiGate Configuration Changes - Evidencia PCI DSS ({{ fortigate_configuration_changes_report_date }})"
          - "{{ fortigate_configuration_changes_evidence_dir }}/{{ fortigate_configuration_changes_file }}"
      changed_when: false
      delegate_to: localhost
  always:
    - name: FortiGate Configuration Changes - Eliminar evidencia y logs del servidor
      ansible.builtin.file:
        path: "{{ fortigate_configuration_changes_tmp.path }}"
        state: absent
      delegate_to: localhost
