---
- name: FortiGate Admin Login Failed - Cargar variables de correo (vault)
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../vars/vault.yml"

- name: FortiGate Admin Login Failed - Definir fecha del reporte (últimas 24 horas)
  ansible.builtin.set_fact:
    fortigate_admin_login_failed_report_date: "{{ now(fmt='%Y-%m-%d') }}"
    fortigate_admin_login_failed_evidence_dir: "{{ fortigate_admin_login_failed_evidence_dir | default('/opt/pci-dss-evidence/fortigate/admin_login_failed') }}"
    fortigate_admin_login_failed_file: "admin login failed.txt"
    # Una sola sesión SSH por FortiGate y por ejecución (ver common/fortigate_collect_logs.sh)
    fortigate_log_cache_dir: "{{ fortigate_log_cache_dir | default('/opt/pci-dss-evidence/fortigate/.cache') }}"
    fortigate_run_id: "{{ lookup('ansible.builtin.env', 'PCI_RUN_ID') }}"

- name: FortiGate Admin Login Failed - Crear directorio de evidencias
  ansible.builtin.file:
    path: "{{ fortigate_admin_login_failed_evidence_dir }}"
    state: directory
    mode: "0750"
  delegate_to: localhost

- name: FortiGate Admin Login Failed - Ejecutar recolección de logs vía CLI (svc_ansible)
  ansible.builtin.command:
    argv:
      - bash
      - "{{ playbook_dir }}/../../roles/fortigate/admin_login_failed/scripts/fortigate_admin_login_failed.sh"
      - "{{ hostvars[item].ansible_host }}"
      - "{{ hostvars[item].ansible_port }}"
      - "{{ hostvars[item].ansible_user }}"
      - "{{ hostvars[item].ansible_ssh_private_key_file }}"
      - "{{ item }}"
      - "{{ fortigate_run_id }}"
      - "{{ fortigate_log_cache_dir }}"
      - "{{ fortigate_admin_login_failed_report_date }}"
  loop: "{{ groups['fortigates'] }}"
  loop_control:
    label: "{{ item }}"
  register: fortigate_admin_login_failed_results
  changed_when: false
  delegate_to: localhost

- name: FortiGate Admin Login Failed - Generar evidencia en archivo .txt (una sección por equipo)
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../roles/fortigate/admin_login_failed/templates/admin_login_failed_report.txt.j2"
    dest: "{{ fortigate_admin_login_failed_evidence_dir }}/{{ fortigate_admin_login_failed_file }}"
    mode: "0640"
  delegate_to: localhost

- name: FortiGate Admin Login Failed - Enviar evidencia por correo
  ansible.builtin.command:
    argv:
      - bash
      - "{{ playbook_dir }}/../../roles/fortigate/common/send_mail_report.sh"
      - "{{ fortigate_mail_from }}"
      - "{{ fortigate_mail_to }}"
      - "FortiGate Admin Login Failed - Evidencia PCI DSS ({{ fortigate_admin_login_failed_report_date }})"
      - "{{ fortigate_admin_login_failed_evidence_dir }}/{{ fortigate_admin_login_failed_file }}"
  changed_when: false
  delegate_to: localhost
