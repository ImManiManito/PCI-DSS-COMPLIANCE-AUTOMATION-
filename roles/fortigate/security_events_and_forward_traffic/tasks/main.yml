---
- name: FortiGate Forward Traffic 7 días - Cargar variables de correo (vault)
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../vars/vault.yml"

- name: FortiGate Forward Traffic 7 días - Definir rango del reporte (últimos 7 días)
  ansible.builtin.set_fact:
    fortigate_forward_traffic_end_date: "{{ now(fmt='%Y-%m-%d') }}"
    fortigate_forward_traffic_start_date: "{{ lookup('pipe', 'date -d \"-6 days\" +%Y-%m-%d') }}"
    fortigate_run_id: "{{ lookup('ansible.builtin.env', 'PCI_RUN_ID') }}"

# Nada se guarda en el servidor: logs y evidencia solo existen en un directorio
# temporal privado (0700) que se elimina al terminar, se envíe o no el correo.
- name: FortiGate Security Events and Forward Traffic 7 días - Crear directorio temporal de trabajo
  ansible.builtin.tempfile:
    state: directory
    prefix: pci_fortigate_forward_traffic_
  register: fortigate_forward_traffic_tmp
  delegate_to: localhost

- name: FortiGate Security Events and Forward Traffic 7 días - Recolectar, generar, enviar y eliminar evidencia
  block:
    # Logs crudos: una sola sesión SSH por FortiGate y por corrida (common/fortigate_collect_logs.sh).
    # En cron se comparten entre playbooks en PCI_RUN_TMPDIR (lo borra scripts_cron/run_*.sh);
    # en una ejecución manual quedan dentro del directorio temporal de este rol.
    - name: FortiGate Security Events and Forward Traffic 7 días - Definir rutas temporales
      ansible.builtin.set_fact:
        fortigate_forward_traffic_evidence_dir: "{{ fortigate_forward_traffic_tmp.path }}"
        fortigate_log_cache_dir: "{{ lookup('ansible.builtin.env', 'PCI_RUN_TMPDIR') | default(fortigate_forward_traffic_tmp.path ~ '/cache', true) }}"

    - name: FortiGate Forward Traffic 7 días - Ejecutar recolección de logs vía CLI (svc_ansible)
      ansible.builtin.command:
        argv:
          - bash
          - "{{ playbook_dir }}/../../roles/fortigate/security_events_and_forward_traffic/scripts/fortigate_forward_traffic_7_days.sh"
          - "{{ hostvars[item].ansible_host }}"
          - "{{ hostvars[item].ansible_port }}"
          - "{{ hostvars[item].ansible_user }}"
          - "{{ hostvars[item].ansible_ssh_private_key_file }}"
          - "{{ item }}"
          - "{{ fortigate_run_id }}"
          - "{{ fortigate_log_cache_dir }}"
      loop: "{{ groups['fortigates'] }}"
      loop_control:
        label: "{{ item }}"
      register: fortigate_forward_traffic_results
      changed_when: false
      delegate_to: localhost

    - name: FortiGate Webfilter 7 días - Ejecutar recolección de logs vía CLI (svc_ansible)
      ansible.builtin.command:
        argv:
          - bash
          - "{{ playbook_dir }}/../../roles/fortigate/security_events_and_forward_traffic/scripts/fortigate_webfilter_7_days.sh"
          - "{{ hostvars[item].ansible_host }}"
          - "{{ hostvars[item].ansible_port }}"
          - "{{ hostvars[item].ansible_user }}"
          - "{{ hostvars[item].ansible_ssh_private_key_file }}"
          - "{{ item }}"
          - "{{ fortigate_run_id }}"
          - "{{ fortigate_log_cache_dir }}"
      loop: "{{ groups['fortigates'] }}"
      loop_control:
        label: "{{ item }}"
      register: fortigate_webfilter_results
      changed_when: false
      delegate_to: localhost

    - name: FortiGate Forward Traffic 7 días - Generar evidencia en archivos .txt
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../roles/fortigate/security_events_and_forward_traffic/templates/forward_traffic_report.txt.j2"
        dest: "{{ fortigate_forward_traffic_evidence_dir }}/Eventos_de_seguridad_y_trafico_forward_{{ item }}.txt"
        mode: "0600"
      loop: "{{ groups['fortigates'] }}"
      loop_control:
        label: "{{ item }}"
        index_var: fortigate_forward_traffic_idx
      vars:
        fortigate_device: "{{ item }}"
        fortigate_raw_output: "{{ fortigate_forward_traffic_results.results[fortigate_forward_traffic_idx].stdout }}"
      delegate_to: localhost

    - name: FortiGate Webfilter 7 días - Generar evidencia en archivos .txt
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../roles/fortigate/security_events_and_forward_traffic/templates/webfilter_report.txt.j2"
        dest: "{{ fortigate_forward_traffic_evidence_dir }}/Eventos_de_webfilter_{{ item }}.txt"
        mode: "0600"
      loop: "{{ groups['fortigates'] }}"
      loop_control:
        label: "{{ item }}"
        index_var: fortigate_webfilter_idx
      vars:
        fortigate_device: "{{ item }}"
        fortigate_raw_output: "{{ fortigate_webfilter_results.results[fortigate_webfilter_idx].stdout }}"
      delegate_to: localhost

    - name: FortiGate Security Events and Forward Traffic 7 días - Enviar evidencia por correo
      ansible.builtin.command:
        argv:
          - bash
          - "{{ playbook_dir }}/../../roles/fortigate/common/send_mail_report.sh"
          - "{{ fortigate_mail_from }}"
          - "{{ fortigate_mail_to }}"
          - "FortiGate Security Events and Forward Traffic 7 días - Evidencia PCI DSS ({{ fortigate_forward_traffic_start_date }} a {{ fortigate_forward_traffic_end_date }})"
          - "{{ fortigate_forward_traffic_evidence_dir }}/Eventos_de_seguridad_y_trafico_forward_{{ item }}.txt"
          - "{{ fortigate_forward_traffic_evidence_dir }}/Eventos_de_webfilter_{{ item }}.txt"
      loop: "{{ groups['fortigates'] }}"
      loop_control:
        label: "{{ item }}"
      changed_when: false
      delegate_to: localhost
  always:
    - name: FortiGate Security Events and Forward Traffic 7 días - Eliminar evidencia y logs del servidor
      ansible.builtin.file:
        path: "{{ fortigate_forward_traffic_tmp.path }}"
        state: absent
      delegate_to: localhost
