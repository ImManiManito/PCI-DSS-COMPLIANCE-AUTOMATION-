---
- name: Checkpoint Events IPS 7 días - Cargar credenciales de Infinity Portal (vault)
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../roles/checkpoint/vars/vault.yml"

- name: Checkpoint Events IPS 7 días - Definir rango de fechas (últimos 7 días)
  ansible.builtin.set_fact:
    checkpoint_events_ips_7d_end_date: "{{ now(fmt='%Y-%m-%d') }}"
    checkpoint_events_ips_7d_start_date: "{{ lookup('pipe', 'date -d \"-6 days\" +%Y-%m-%d') }}"
    checkpoint_events_ips_7d_start_time: "{{ lookup('pipe', 'date -d \"-6 days\" +%Y-%m-%d') }}T00:00:00Z"
    checkpoint_events_ips_7d_end_time: "{{ now(fmt='%Y-%m-%d') }}T23:59:59Z"
    checkpoint_events_ips_7d_evidence_dir: "{{ checkpoint_events_ips_7d_evidence_dir | default('/opt/pci-dss-evidence/checkpoint/events_ips_7_days') }}"

- name: Checkpoint Events IPS 7 días - Crear directorio de evidencias
  ansible.builtin.file:
    path: "{{ checkpoint_events_ips_7d_evidence_dir }}"
    state: directory
    mode: "0750"
  delegate_to: localhost

- name: Checkpoint Events IPS 7 días - Consultar Infinity Events y generar evidencia CSV
  ansible.builtin.shell:
    cmd: >
      bash "{{ playbook_dir }}/../../roles/checkpoint/events_ips_7_days/scripts/checkpoint_events_ips_7_days.sh"
      "{{ checkpoint_infinity_auth_url }}"
      "{{ checkpoint_infinity_events_url }}"
      "{{ checkpoint_events_ips_7d_start_time }}"
      "{{ checkpoint_events_ips_7d_end_time }}"
      | python3 "{{ playbook_dir }}/../../roles/checkpoint/events_ips_7_days/scripts/parse_events_ips.py"
      > "{{ checkpoint_events_ips_7d_evidence_dir }}/Eventos IPS_Anti-bot_Anti-virus_FiltroWeb_7_dias.csv"
  environment:
    CHECKPOINT_CLIENT_ID: "{{ checkpoint_infinity_client_id }}"
    CHECKPOINT_ACCESS_KEY: "{{ checkpoint_infinity_access_key }}"
  register: checkpoint_events_ips_7d_result
  changed_when: false
  no_log: true
  delegate_to: localhost

- name: Checkpoint Events IPS 7 días - Enviar evidencia por correo
  ansible.builtin.command:
    cmd:
      - bash
      - "{{ playbook_dir }}/../../roles/checkpoint/common/send_mail_report.sh"
      - "{{ checkpoint_mail_from }}"
      - "{{ checkpoint_mail_to }}"
      - "Checkpoint Events IPS 7 días - Evidencia PCI DSS ({{ checkpoint_events_ips_7d_start_date }} a {{ checkpoint_events_ips_7d_end_date }})"
      - "{{ checkpoint_events_ips_7d_evidence_dir }}/Eventos IPS_Anti-bot_Anti-virus_FiltroWeb_7_dias.csv"
  changed_when: false
  delegate_to: localhost
