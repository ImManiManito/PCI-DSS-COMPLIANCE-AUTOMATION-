---
- name: Checkpoint Events IPS - Cargar credenciales de Infinity Portal (vault)
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../vars/vault.yml"

- name: Checkpoint Events IPS - Definir rango de fechas (últimas 24 horas, 00:00 a 23:59)
  ansible.builtin.set_fact:
    checkpoint_events_ips_report_date: "{{ now(fmt='%Y-%m-%d') }}"
    checkpoint_events_ips_start_time: "{{ now(fmt='%Y-%m-%d') }}T00:00:00Z"
    checkpoint_events_ips_end_time: "{{ now(fmt='%Y-%m-%d') }}T23:59:59Z"

# La evidencia solo existe en un directorio temporal privado (0700) mientras se envía:
# en cuanto postfix acepta el correo (o si algo falla) se elimina del servidor.
- name: Checkpoint Events IPS - Crear directorio temporal de evidencias
  ansible.builtin.tempfile:
    state: directory
    prefix: pci_checkpoint_events_ips_
  register: checkpoint_events_ips_tmp
  delegate_to: localhost

- name: Checkpoint Events IPS - Generar, enviar y eliminar evidencia
  block:
    - name: Checkpoint Events IPS - Definir ruta temporal de la evidencia
      ansible.builtin.set_fact:
        checkpoint_events_ips_evidence_dir: "{{ checkpoint_events_ips_tmp.path }}"

    # pipefail: si falla la consulta a la API la tarea falla, en vez de enviar un CSV vacío.
    - name: Checkpoint Events IPS - Consultar Infinity Events y generar evidencia CSV
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >
          set -o pipefail;
          bash "{{ playbook_dir }}/../../roles/checkpoint/events_ips/scripts/checkpoint_events_ips.sh"
          "{{ checkpoint_infinity_auth_url }}"
          "{{ checkpoint_infinity_events_url }}"
          "{{ checkpoint_events_ips_start_time }}"
          "{{ checkpoint_events_ips_end_time }}"
          | python3 "{{ playbook_dir }}/../../roles/checkpoint/events_ips/scripts/parse_events_ips.py"
          > "{{ checkpoint_events_ips_evidence_dir }}/Eventos IPS_Anti-bot_Anti-virus_FiltroWeb.csv"
      environment:
        CHECKPOINT_CLIENT_ID: "{{ checkpoint_infinity_client_id }}"
        CHECKPOINT_ACCESS_KEY: "{{ checkpoint_infinity_access_key }}"
      register: checkpoint_events_ips_result
      changed_when: false
      no_log: true
      delegate_to: localhost

    - name: Checkpoint Events IPS - Enviar evidencia por correo
      ansible.builtin.command:
        argv:
          - bash
          - "{{ playbook_dir }}/../../roles/checkpoint/common/send_mail_report.sh"
          - "{{ checkpoint_mail_from }}"
          - "{{ checkpoint_mail_to }}"
          - "Checkpoint Events IPS - Evidencia PCI DSS ({{ checkpoint_events_ips_report_date }})"
          - "{{ checkpoint_events_ips_evidence_dir }}/Eventos IPS_Anti-bot_Anti-virus_FiltroWeb.csv"
      changed_when: false
      delegate_to: localhost
  always:
    - name: Checkpoint Events IPS - Eliminar evidencia del servidor
      ansible.builtin.file:
        path: "{{ checkpoint_events_ips_tmp.path }}"
        state: absent
      delegate_to: localhost
