[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
# Contraseña de Ansible Vault leída de un archivo del usuario que ejecuta Ansible
# (permisos 400): cron y las ejecuciones manuales no la piden.
vault_password_file = ~/.ansible/.vault_pass

[ssh_connection]
pipelining = True